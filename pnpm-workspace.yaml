packages:
  - apps/*
  - packages/*

# Pin exact versions when adding dependencies (security.md R10).
saveExact: true

# Install scripts are blocked unless listed here (supply-chain protection).
# cpu-features/ssh2/protobufjs are optional native extras of Testcontainers we do not need.
allowBuilds:
  '@swc/core': true
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Used by drizzle-kit (dev tool); works without its install script.
  esbuild: false
  # Resolver used by the import lint rules; its prebuilt binary installs without the script.
  unrs-resolver: false

# Security overrides: force patched versions of transitive dependencies.
# Remove an entry once the parent package ships the fix itself.
overrides:
  # GHSA-q7qp-rjg7-q26m (high, DoS). Pulled in by @nestjs/platform-express 12.2.0, which pins 2.4.0.
  multer: 2.5.0

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.13'
  - '@better-auth/drizzle-adapter@1.7.13'
  - '@better-auth/kysely-adapter@1.7.13'
  - '@better-auth/memory-adapter@1.7.13'
  - '@better-auth/mongo-adapter@1.7.13'
  - '@better-auth/prisma-adapter@1.7.13'
  - '@better-auth/telemetry@1.7.13'
  - better-auth@1.7.13
  - lucide-react@1.63.0
  - '@hookform/resolvers@6.0.2'
