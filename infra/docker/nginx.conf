# Serves the web app and forwards the API (docs/operations.md section 5).
# The API container is reached as "api:3000"; change it if yours differs.

# The scheme people really used, when an HTTPS proxy stands in front of this container.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  client_max_body_size 26m; # FILE_MAX_BYTES (25 MB) plus multipart overhead

  # Compress the app's own files (never API responses: they may mix secrets with user input).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml text/plain application/json;

  location /api/ {
    proxy_pass http://api:3000;
    gzip off;
    # Keep the company address exactly as the browser sent it (with any port): the API takes
    # the company from Host and compares Origin with it.
    proxy_set_header Host $http_host;
    # Never pass a client-supplied X-Forwarded-Host: only Host decides the company.
    proxy_set_header X-Forwarded-Host "";
    # Appends the address this container received from; the API reads it with TRUST_PROXY_HOPS.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  # Hashed build files never change: cache them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Every other path is a screen of the single-page app.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}