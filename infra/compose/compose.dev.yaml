# Local development services. Run from the repo root with `pnpm services:up`.
# All ports bind to 127.0.0.1 so nothing is exposed to your network.
name: ultimate-erp

services:
  postgres:
    image: postgres:18.6-alpine
    # Come back automatically when Docker Desktop starts (e.g. after a reboot).
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (replaces MinIO, which stopped publishing images).
  object-storage:
    image: rustfs/rustfs:1.0.3
    # Come back automatically when Docker Desktop starts (e.g. after a reboot).
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${S3_PORT}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT}:9001'
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10

  # Virus scanner for uploads (Milestone 1.5b). The image includes a virus database; it loads
  # in about a minute after start. Needs ~1 GB of memory.
  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    ports:
      - '127.0.0.1:${CLAMAV_PORT}:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # Fake SMTP server + web inbox. Emails sent in dev never leave your machine.
  mailpit:
    image: axllent/mailpit:v1.32.0
    # Come back automatically when Docker Desktop starts (e.g. after a reboot).
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SMTP_PORT}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT}:8025'

volumes:
  postgres-data:
  object-storage-data:
  clamav-data:
